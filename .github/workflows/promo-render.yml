name: Render promo images

on:
  workflow_dispatch:
  push:
    paths:
      - "promo/render_promo.py"
      - ".github/workflows/promo-render.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender xvfb
          blender --version

      - name: Render promo PNGs
        run: |
          xvfb-run -a blender -b --factory-startup --python promo/render_promo.py

      - name: List output
        run: ls -la promo/*.png

      - name: Commit PNGs
        run: |
          git config user.name "lyxadev"
          git config user.email "lyxadev@users.noreply.github.com"
          git add promo/*.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update promo images (Blender render)"
            git push
          fi
